[package]
name = "m5paperdiy-common"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "Hardware-free code shared by the blocking and async M5Stack PaperDIY examples"

# Its own Cargo root, like `blocking/`, `async/` and `host-tests/`, so no features are unified between them.
[workspace]

[features]
default = ["blocking"]
# The blocking and async APIs of `epdpi` are mutually exclusive. If this crate ever depends on `epdpi`, do
# it as `default-features = false` and forward this feature (`blocking = ["epdpi/blocking"]`), like
# `epdpi-esp` does, so an async user never gets the core switched into blocking mode.
blocking = []

[dependencies]
# Pinned exactly: these crates are beta and one author's, from the PaperPaw e-reader stack. All three are
# `no_std` and build for the ESP32-S3. `paperpaw-zip` reads an archive through the `Storage` trait of
# `paperpaw-platform`, which the examples implement for the microSD card.
paperpaw-platform = "=0.5.0-beta.12"
paperpaw-zip = "=0.5.0-beta.12"
paperpaw-xml = "=0.5.0-beta.12"
embedded-graphics = { version = "0.8.1", default-features = false }
# The serif fonts the reader draws with. `u8g2-fonts` is `no_std`, like the other examples use it.
u8g2-fonts = { version = "0.8.0", default-features = false, features = ["embedded_graphics_textstyle"] }
# The FAT driver, generic over the block device. The default `log` feature only adds the `log` facade.
embedded-sdmmc = { version = "0.10.0", default-features = false }
