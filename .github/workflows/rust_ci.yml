name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  rust-checks:
    name: ${{ matrix.crate }} ${{ matrix.command }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: blocking
            command: build
            args: --bins --examples --release
          - crate: blocking
            command: fmt
            args: --all -- --check
          - crate: blocking
            command: clippy
            args: --bins --examples --workspace -- -D warnings
          - crate: async
            command: build
            args: --lib --examples --release
          - crate: async
            command: fmt
            args: --all -- --check
          - crate: async
            command: clippy
            args: --lib --examples -- -D warnings
          - crate: common
            command: fmt
            args: --all -- --check
          - crate: common
            command: clippy
            args: --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc -- -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Fetch sibling epdpi checkout
        # Both crates depend on `../../epdpi` by path until the crate is published.
        run: git clone --depth 1 https://github.com/melastmohican/epdpi ../epdpi
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: false
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - name: Run command
        working-directory: ${{ matrix.crate }}
        run: cargo ${{ matrix.command }} ${{ matrix.args }}

  host-tests:
    name: Host tests (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: blocking
            args: ""
          - mode: async
            args: --no-default-features
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Fetch sibling epdpi checkout
        # host-tests depends on ../../epdpi by path.
        run: git clone --depth 1 https://github.com/melastmohican/epdpi ../epdpi
      - name: Setup Rust
        # Host toolchain, not the esp one: run.sh starts cargo from a neutral directory, so the
        # crates' rust-toolchain.toml and .cargo/config.toml do not apply.
        uses: dtolnay/rust-toolchain@stable
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: host-tests
      - name: Run host tests
        run: ./host-tests/run.sh ${{ matrix.args }}
